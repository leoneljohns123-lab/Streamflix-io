<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08101a" />
      <stop offset="50%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#050a10" />
    </linearGradient>
    <linearGradient id="streamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#d1fae5" />
    </linearGradient>
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#10b981" stroke-width="6" stroke-opacity="0.35" />

  <!-- Outer glowing cinema ring -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="url(#streamGrad)" stroke-width="12" stroke-linecap="round" stroke-dasharray="720 180" filter="url(#emeraldGlow)" />

  <!-- Stylized Play Button & Stream Ribbon -->
  <g transform="translate(256, 256)">
    <!-- Inner glowing shield/disc -->
    <circle r="120" fill="#0b1e2c" stroke="#10b981" stroke-width="3" stroke-opacity="0.4" />
    
    <!-- Play Triangle with smooth rounded corners -->
    <path d="M -24 -56 L 60 0 L -24 56 Z" fill="url(#playGrad)" filter="url(#emeraldGlow)" stroke="#10b981" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" />
  </g>

  <!-- Accent sparkles -->
  <circle cx="380" cy="140" r="8" fill="#34d399" opacity="0.8" />
  <circle cx="140" cy="370" r="6" fill="#06b6d4" opacity="0.7" />
</svg>
